# Lancement complet : docker compose up --build, puis http://localhost:8080
# Mode démo (données simulées) : MT_DEMO=1 docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MT_DEMO: ${MT_DEMO:-0}
      MT_PROVIDER: ${MT_PROVIDER:-yahoo}
    volumes:
      - mt-data:/app/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"      # local seulement : l'API n'a pas d'authentification
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mt-data:
